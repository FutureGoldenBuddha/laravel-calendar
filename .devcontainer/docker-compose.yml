services:

  # ── PHP / Laravel App ─────────────────────────────────────────────────────
  app:
    build:
      context: ..
      dockerfile: .devcontainer/docker/php/Dockerfile
    container_name: teste_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - app_data:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
    networks:
      - teste_network
    depends_on:
      - db

  # ── Nginx (forwards :8000 → app:9000) ────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: teste_nginx
    restart: unless-stopped
    ports:
      - "8007:80"          # ← visit http://localhost:8005
    volumes:
      - app_data:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - teste_network
    depends_on:
      - app

  # ── MySQL ─────────────────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: teste_db
    restart: unless-stopped
    ports:
      - "33060:3306"       # optional: access DB from host on port 33060
    environment:
      MYSQL_DATABASE: site_database
      MYSQL_USER: admin_user
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - teste_network

  # ── phpMyAdmin (optional — handy for browsing the DB) ─────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: teste_pma
    restart: unless-stopped
    ports:
      - "8088:80"          # visit http://localhost:8085
    environment:
      PMA_HOST: db
      PMA_USER: admin_user
      PMA_PASSWORD: secret
    networks:
      - teste_network
    depends_on:
      - db

# ── Volumes & Networks ────────────────────────────────────────────────────────
volumes:
  app_data:
  db_data:

networks:
  teste_network:
    driver: bridge
